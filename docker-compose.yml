version: "3.9"

services:
  # ──────────────────────────────────────────
  # MongoDB
  # ──────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: smartprint-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: smartprint
    networks:
      - smartprint-net

  # ──────────────────────────────────────────
  # MinIO (S3-compatible object storage)
  # ──────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: smartprint-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console UI
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - smartprint-net

  # ──────────────────────────────────────────
  # MinIO bucket initialisation (one-shot)
  # ──────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: smartprint-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/smartprint;
        mc anonymous set download local/smartprint;
        echo 'Bucket ready.';
      "
    networks:
      - smartprint-net

  # ──────────────────────────────────────────
  # Backend  (Node / Express)
  # ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartprint-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongo
      - minio
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/smartprint
      JWT_SECRET: ${JWT_SECRET:-smartprint_dev_secret_change_me}
      JWT_EXPIRE: 7d
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: smartprint
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_MOCK}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-MOCK_SECRET}
      CLIENT_URL: http://localhost:5173
    networks:
      - smartprint-net

  # ──────────────────────────────────────────
  # Frontend  (Vite + React) — dev server
  # Comment out in production; serve static build via nginx instead
  # ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartprint-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:5000
    networks:
      - smartprint-net

volumes:
  mongo_data:
  minio_data:

networks:
  smartprint-net:
    driver: bridge
